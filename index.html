<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Form & Fuel">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Form & Fuel</title>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">PERSONAL PERFORMANCE</p><h1>Form <span>&</span> Fuel</h1></div>
    <button class="icon-button" id="settingsButton" aria-label="Open settings"></button>
  </header>
  <main>
    <div id="setupNotice" class="notice hidden"></div>
    <nav class="tabs" aria-label="Main navigation">
      <button class="tab active" data-page="routines">Routines</button>
      <button class="tab" data-page="activity">Activity</button>
      <button class="tab" data-page="diet">Diet</button>
      <button class="tab" data-page="history">History</button>
    </nav>
    <section id="routines" class="page active"></section>
    <section id="activity" class="page"></section>
    <section id="diet" class="page"></section>
    <section id="history" class="page"></section>
  </main>
  <dialog id="settingsDialog"><form method="dialog" id="settingsForm"><div class="dialog-head"><h2>Settings</h2><button value="cancel" class="icon-button">×</button></div><label>Weight unit<select id="weightUnit"><option value="lb">Pounds (lb)</option><option value="kg">Kilograms (kg)</option></select></label><label>Rest timer (seconds)<input id="restSeconds" type="number" min="0" step="5"></label><div class="dialog-actions"><button class="button ghost" value="cancel">Close</button><button class="button" value="save">Save settings</button></div><hr><button type="button" class="button danger" id="changeKey">Change sync key</button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
